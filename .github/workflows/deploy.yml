name: Deploy

# Déploie uniquement quand la CI est verte :
# - PR    -> preview Vercel + projet Supabase de test (« staging »)
# - main  -> production Vercel + migrations sur le projet Supabase de production
#            (push ou relance manuelle de la CI)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Tant que les secrets Vercel/Supabase ne sont pas configurés, on ne tente rien.
  check:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request' && 'production' || 'preview' }}
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Déploiement ignoré : secrets Vercel/Supabase pas encore configurés." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request' && 'production' || 'preview' }}
    env:
      IS_PRODUCTION: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request' }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Appliquer les migrations Supabase
        # Connexion directe par le session pooler (IPv4) : pas besoin de l'API de gestion Supabase.
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
        run: |
          if [ -z "$SUPABASE_POOLER_HOST" ]; then echo "Variable SUPABASE_POOLER_HOST manquante pour cet environnement."; exit 1; fi
          password=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          echo "::add-mask::$password"
          pnpm exec supabase db push --db-url "postgresql://postgres.${SUPABASE_PROJECT_REF}:${password}@${SUPABASE_POOLER_HOST}:5432/postgres"

      - name: Récupérer la configuration Vercel
        run: pnpm dlx vercel@latest pull --yes --environment=${{ env.IS_PRODUCTION == 'true' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: pnpm dlx vercel@latest build ${{ env.IS_PRODUCTION == 'true' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Déployer
        id: deploy
        run: |
          url=$(pnpm dlx vercel@latest deploy --prebuilt ${{ env.IS_PRODUCTION == 'true' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Déployé sur $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Lien de preview sur la PR
        if: env.IS_PRODUCTION != 'true' && github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "${{ github.repository }}" --search "${{ github.event.workflow_run.head_sha }}" --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "${{ github.repository }}" --body "Preview Sparkly : ${{ steps.deploy.outputs.url }}"
          fi
