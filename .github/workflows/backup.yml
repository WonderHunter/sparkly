name: Backup

# Le plan gratuit de Supabase n'a pas de sauvegarde automatique :
# dump hebdomadaire de la production, chiffré, conservé 30 jours en artefact privé.
on:
  schedule:
    - cron: "42 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Dump du schéma et des données
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backup
          pnpm exec supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          pnpm exec supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -f backup/data.sql
          pnpm exec supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f backup/roles.sql

      - name: Chiffrer
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          tar czf backup.tar.gz backup
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o "sparkly-$(date +%F).tar.gz.gpg" backup.tar.gz
          rm -rf backup backup.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: sparkly-backup
          path: sparkly-*.tar.gz.gpg
          retention-days: 30
