name: Backup

# Le plan gratuit de Supabase n'a pas de sauvegarde automatique :
# dump hebdomadaire de la production, chiffré, conservé 30 jours en artefact privé.
on:
  schedule:
    - cron: "42 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Dump du schéma et des données
        id: dump
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_POOLER_HOST" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "Sauvegarde ignorée : SUPABASE_POOLER_HOST ou BACKUP_PASSPHRASE pas encore configurés." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          password=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          echo "::add-mask::$password"
          db_url="postgresql://postgres.${SUPABASE_PROJECT_REF}:${password}@${SUPABASE_POOLER_HOST}:5432/postgres"
          mkdir -p backup
          pnpm exec supabase db dump --db-url "$db_url" -f backup/schema.sql
          pnpm exec supabase db dump --db-url "$db_url" --data-only --use-copy -f backup/data.sql
          pnpm exec supabase db dump --db-url "$db_url" --role-only -f backup/roles.sql

      - name: Chiffrer
        if: steps.dump.outputs.skip != 'true'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          tar czf backup.tar.gz backup
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o "sparkly-$(date +%F).tar.gz.gpg" backup.tar.gz
          rm -rf backup backup.tar.gz

      - uses: actions/upload-artifact@v4
        if: steps.dump.outputs.skip != 'true'
        with:
          name: sparkly-backup
          path: sparkly-*.tar.gz.gpg
          retention-days: 30
